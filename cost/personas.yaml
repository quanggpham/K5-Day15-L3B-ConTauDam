# Mô phỏng chi phí khi dùng thật — guide bước 4.2.
# Mọi số phải có nguồn hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung)
#       python run.py simulate         (đủ số phiên dưới đây)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số coach / giảng viên dùng thật — người dùng chính là coach, không phải học viên
  low: 5
  base: 10
  high: 20
  source: "Người dùng chính là giảng viên và lab coach AI20K (canvas.md dòng 2; docs/learningpulse-design.md dòng 21), không phải học viên nên không dùng mốc lớp L3 hơn 700 học viên (README hackathon). Repo và README đề không ghi số coach, nên 5 / 10 / 20 là (tự ước tính)."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: coach_it
    share: 0.5              # tỉ lệ coach kiểu này
    uses_per_month: 4       # số phiên / coach / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "(tự ước tính) khoảng 1 phiên mỗi tuần; chưa có phỏng vấn hay khảo sát, spec.md §2 chưa điền số lần / tháng"
  - name: coach_vua
    share: 0.3
    uses_per_month: 8
    turns_per_session: 2
    source: "(tự ước tính) khoảng 2 phiên mỗi tuần, hỏi thêm một lượt sau khi xem báo cáo"
  - name: coach_nhieu
    share: 0.2
    uses_per_month: 16
    turns_per_session: 3
    source: "(tự ước tính) chuẩn bị nhiều bài mỗi tuần, so sánh vài bài trong một phiên; số lượt này không đếm được từ data/pre_class vì đó là lượt của học viên"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token. ≥2 mức model
  - model: lfm3-1.7b
    input: 0.08
    output: 0.20
    source: "https://www.liquid.ai/pricing (LFM3-1.7B: input 0.08, cached input 0.02, output 0.20) · xem 28/11/2026. Đây là model đo token thật"
  - model: claude-sonnet-5.5
    input: 2.00
    output: 10.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing, chép từ further-reading/model-prices.md của repo đề · BTC xem 25/11/2026. Tính giá model mạnh trên token đo bằng LFM3-1.7B"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
