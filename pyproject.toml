[project]
name = "contaudam"
version = "0.1.0"
description = "AI20K hackathon - ConTauDam"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.162.5",
    "httpx>=0.29.0",
    "langchain>=1.4.10",
    "langfuse>=4.18.0",
    "langgraph>=1.2.24",
    "openai>=3.60.0",
    "pandas>=2.3.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=7.2.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]
