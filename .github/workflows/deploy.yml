name: CI and Railway
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
        working-directory: codebase/frontend
      - run: pnpm build
        working-directory: codebase/frontend
      - run: docker build -t learningpulse:ci .
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
        working-directory: codebase/frontend
      - run: pnpm exec playwright install --with-deps chromium --only-shell
        working-directory: codebase/frontend
      - run: pnpm exec playwright test
        working-directory: codebase/frontend
  deploy:
    needs: [ci, ui-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @railway/cli@5.76.0
      - name: Sync application configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LIQUID_API_KEY: ${{ secrets.LIQUID_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -eu
          : "${RAILWAY_TOKEN:?Missing RAILWAY_TOKEN}"
          : "${RAILWAY_SERVICE:?Missing RAILWAY_SERVICE}"
          : "${SUPABASE_URL:?Missing SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing SUPABASE_PUBLISHABLE_KEY}"
          : "${LIQUID_API_KEY:?Missing LIQUID_API_KEY}"
          : "${TYPESAFE_API_KEY:?Missing TYPESAFE_API_KEY}"
          printf '%s' "$SUPABASE_URL" | railway variable set SUPABASE_URL --service "$RAILWAY_SERVICE" --stdin --skip-deploys
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | railway variable set SUPABASE_PUBLISHABLE_KEY --service "$RAILWAY_SERVICE" --stdin --skip-deploys
          printf '%s' "$LIQUID_API_KEY" | railway variable set LIQUID_API_KEY --service "$RAILWAY_SERVICE" --stdin --skip-deploys
          printf '%s' "$TYPESAFE_API_KEY" | railway variable set TYPESAFE_API_KEY --service "$RAILWAY_SERVICE" --stdin --skip-deploys
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --ci
